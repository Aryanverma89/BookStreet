<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | BookStreet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Existing CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <!-- =====================================================
         REGISTER PAGE ONLY CSS
    ====================================================== -->

    <style>

        /* ================================================
           RESET
        ================================================= */

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            min-height: 100% !important;
        }


        /* ================================================
           PAGE
        ================================================= */

        .bookstreet-register-page {

            width: 100vw !important;
            min-height: 100vh !important;

            margin: 0 !important;
            padding: 0 !important;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.48),
                    rgba(0, 0, 0, 0.48)
                ),
                url("{{ url_for('static', filename='images/auth-books.jpg') }}") !important;

            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;

            overflow-x: hidden !important;
        }


        /* ================================================
           NAVBAR
        ================================================= */

        .bookstreet-register-page .register-navbar {

            width: 100% !important;
            max-width: none !important;

            height: 64px !important;

            margin: 0 !important;
            padding: 0 30px !important;

            background: #ffffff !important;

            display: flex !important;
            align-items: center !important;

            box-sizing: border-box !important;

            position: relative !important;
            left: 0 !important;
            right: 0 !important;

            z-index: 10 !important;
        }


        .bookstreet-register-page .register-navbar-inner {

            width: 100% !important;
            max-width: 1400px !important;

            margin: 0 auto !important;

            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
        }


        /* Brand */

        .bookstreet-register-page .register-brand {

            color: #111827 !important;

            text-decoration: none !important;

            font-size: 18px !important;
            font-weight: 700 !important;

            white-space: nowrap !important;
        }


        /* Home button */

        .bookstreet-register-page .register-home {

            color: #111827 !important;

            background: #ffffff !important;

            border: 1px solid #dee2e6 !important;

            border-radius: 8px !important;

            padding: 8px 16px !important;

            text-decoration: none !important;

            font-size: 14px !important;
            font-weight: 600 !important;
        }


        .bookstreet-register-page .register-home:hover {

            background: #f8f9fa !important;
        }


        /* ================================================
           MAIN AREA
        ================================================= */

        .bookstreet-register-page .register-main {

            width: 100% !important;
            min-height: calc(100vh - 64px) !important;

            margin: 0 !important;
            padding: 45px 20px !important;

            display: flex !important;
            justify-content: center !important;
            align-items: center !important;

            box-sizing: border-box !important;
        }


        /* ================================================
           REGISTER CARD
        ================================================= */

        .bookstreet-register-page .register-card {

            width: 100% !important;
            max-width: 500px !important;

            margin: 0 auto !important;
            padding: 35px 38px !important;

            background: rgba(255, 255, 255, 0.97) !important;

            border-radius: 18px !important;

            border: none !important;

            box-shadow:
                0 20px 55px rgba(0, 0, 0, 0.35) !important;

            box-sizing: border-box !important;
        }


        /* ================================================
           ICON
        ================================================= */

        .bookstreet-register-page .register-icon {

            width: 55px !important;
            height: 55px !important;

            margin: 0 auto 14px auto !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background: #eef2ff !important;

            border-radius: 14px !important;

            font-size: 27px !important;
        }


        /* ================================================
           HEADING
        ================================================= */

        .bookstreet-register-page .register-title {

            margin: 0 !important;

            text-align: center !important;

            font-size: 28px !important;
            font-weight: 700 !important;

            color: #111827 !important;
        }


        .bookstreet-register-page .register-subtitle {

            margin: 8px 0 25px 0 !important;

            text-align: center !important;

            font-size: 14px !important;

            color: #6b7280 !important;
        }


        /* ================================================
           FORM
        ================================================= */

        .bookstreet-register-page .register-form-group {

            margin-bottom: 17px !important;
        }


        .bookstreet-register-page .register-label {

            display: block !important;

            margin-bottom: 7px !important;

            font-size: 13px !important;

            font-weight: 600 !important;

            color: #1f2937 !important;
        }


        .bookstreet-register-page .register-input {

            display: block !important;

            width: 100% !important;
            height: 50px !important;

            padding: 10px 13px !important;

            border: 1px solid #d1d5db !important;

            border-radius: 8px !important;

            background: #ffffff !important;

            color: #111827 !important;

            font-size: 14px !important;

            outline: none !important;

            box-sizing: border-box !important;
        }


        .bookstreet-register-page .register-input:focus {

            border-color: #198754 !important;

            box-shadow:
                0 0 0 3px rgba(25, 135, 84, 0.12) !important;
        }


        /* ================================================
           CREATE ACCOUNT BUTTON
        ================================================= */

        .bookstreet-register-page .register-button {

            width: 100% !important;
            height: 50px !important;

            margin-top: 3px !important;

            border: none !important;

            border-radius: 8px !important;

            background: #198754 !important;

            color: white !important;

            font-size: 14px !important;

            font-weight: 600 !important;

            cursor: pointer !important;
        }


        .bookstreet-register-page .register-button:hover {

            background: #157347 !important;
        }


        /* ================================================
           MESSAGE
        ================================================= */

        .bookstreet-register-page #message {

            width: 100% !important;

            margin-top: 15px !important;

            text-align: center !important;
        }


        /* ================================================
           LOGIN LINK
        ================================================= */

        .bookstreet-register-page .register-login {

            margin-top: 22px !important;
            padding-top: 20px !important;

            border-top: 1px solid #e5e7eb !important;

            text-align: center !important;

            font-size: 13px !important;

            color: #6b7280 !important;
        }


        .bookstreet-register-page .register-login a {

            color: #4f46e5 !important;

            font-weight: 600 !important;

            text-decoration: none !important;
        }


        /* ================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .bookstreet-register-page .register-navbar {

                padding: 0 15px !important;
            }


            .bookstreet-register-page .register-main {

                padding: 25px 15px !important;
            }


            .bookstreet-register-page .register-card {

                padding: 30px 22px !important;

                max-width: 100% !important;
            }


            .bookstreet-register-page .register-title {

                font-size: 24px !important;
            }
        }

    </style>

</head>


<body class="bookstreet-register-page">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="register-navbar">

        <div class="register-navbar-inner">

            <a
                href="/"
                class="register-brand">

                📚 BookStreet

            </a>


            <a
                href="/"
                class="register-home">

                ← Home

            </a>

        </div>

    </nav>



    <!-- =====================================================
         REGISTER AREA
    ====================================================== -->

    <main class="register-main">


        <div class="register-card">


            <!-- ICON -->

            <div class="register-icon">

                📚

            </div>


            <!-- TITLE -->

            <h1 class="register-title">

                Create Your Account

            </h1>


            <p class="register-subtitle">

                Join BookStreet and start buying or selling books.

            </p>



            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="register-form-group">

                    <label
                        for="name"
                        class="register-label">

                        Full Name

                    </label>


                    <input
                        type="text"
                        id="name"
                        class="register-input"
                        placeholder="Enter your name"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="register-form-group">

                    <label
                        for="email"
                        class="register-label">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        class="register-input"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PHONE -->

                <div class="register-form-group">

                    <label
                        for="phone"
                        class="register-label">

                        Phone Number

                    </label>


                    <input
                        type="tel"
                        id="phone"
                        class="register-input"
                        placeholder="Enter your phone number"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="register-form-group">

                    <label
                        for="password"
                        class="register-label">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        class="register-input"
                        placeholder="Create a password"
                        required>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-button">

                    📝 Create Account

                </button>


            </form>



            <!-- MESSAGE -->

            <div id="message"></div>



            <!-- LOGIN -->

            <div class="register-login">

                Already have an account?

                <a href="/login-page">

                    Login

                </a>

            </div>


        </div>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(e) {

                e.preventDefault();


                const name =
                    document.getElementById("name").value.trim();


                const email =
                    document.getElementById("email").value.trim();


                const phone =
                    document.getElementById("phone").value.trim();


                const password =
                    document.getElementById("password").value;


                const message =
                    document.getElementById("message");


                try {

                    const response = await fetch(
                        "/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                name: name,
                                email: email,
                                phone: phone,
                                password: password

                            })
                        }
                    );


                    const result =
                        await response.json();


                    if (result.success) {

                        message.innerHTML = `
                            <div class="alert alert-success">
                                ✅ Registration Successful!
                                Redirecting to login...
                            </div>
                        `;


                        setTimeout(function() {

                            window.location.href =
                                "/login-page";

                        }, 1000);


                    } else {

                        message.innerHTML = `
                            <div class="alert alert-danger">
                                ❌ ${result.message}
                            </div>
                        `;

                    }


                } catch (error) {

                    console.error(error);


                    message.innerHTML = `
                        <div class="alert alert-danger">
                            Something went wrong.
                            Please try again.
                        </div>
                    `;

                }

            });

    </script>


</body>

</html>
