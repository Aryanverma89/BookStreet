<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | BookStreet</title>


    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar">

    <div class="container">

        <a
            class="navbar-brand"
            href="/">

            📚 BookStreet

        </a>


        <a
            href="/"
            class="btn btn-outline-primary">

            ← Home

        </a>

    </div>

</nav>



<!-- =====================================================
     LOGIN
===================================================== -->

<section class="auth-page">

    <div class="container auth-container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card auth-card">

                    <div class="card-body p-4 p-md-5">


                        <!-- ICON -->

                        <div class="text-center mb-4">

                            <div class="auth-icon">

                                📚

                            </div>


                            <h2 class="fw-bold mt-2">

                                Welcome Back

                            </h2>


                            <p class="text-muted mb-0">

                                Login to continue to BookStreet

                            </p>

                        </div>



                        <!-- =================================================
                             LOGIN FORM
                        ================================================= -->

                        <form
                            action="/login"
                            method="POST">


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold">

                                    Password

                                </label>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>

                            </div>



                            <!-- LOGIN BUTTON -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 btn-lg mt-2">

                                Login →

                            </button>


                        </form>



                        <!-- REGISTER -->

                        <div class="text-center mt-4">

                            <span class="text-muted">

                                Don't have an account?

                            </span>


                            <a
                                href="/register-page"
                                class="fw-bold">

                                Create Account

                            </a>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


</body>

</html>
